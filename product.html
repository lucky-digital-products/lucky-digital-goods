<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product | Lucky Digital Goods</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">🌿 <span>Lucky Digital Goods</span></a>
    <nav class="header-actions">
      <a href="checkout.html" class="cart-button">Cart <span id="cart-count">0</span></a>
    </nav>
  </header>

  <main class="container product-page">
    <a class="back-link" href="index.html">← Back to store</a>

    <section id="product-detail" class="product-detail">
      <div class="gallery">
        <div class="main-image-wrap">
          <button id="prev-image" class="gallery-arrow left" aria-label="Previous image">‹</button>
          <img id="main-product-image" class="main-product-image" alt="" />
          <button id="next-image" class="gallery-arrow right" aria-label="Next image">›</button>
        </div>
        <div id="thumbnail-row" class="thumbnail-row"></div>
      </div>

      <div class="product-info">
        <div class="badge">Digital product</div>
        <h1 id="product-name"></h1>
        <div id="product-price" class="big-price"></div>
        <p id="product-short" class="lead"></p>

        <div class="purchase-actions">
          <button id="buy-now" class="btn btn-primary">Buy now</button>
          <button id="add-cart" class="btn btn-secondary">Add to cart</button>
        </div>

        <div class="mini-trust">
          <span>✓ Secure hosted payment</span>
          <span>✓ Fast digital delivery</span>
          <span>✓ Simple mobile checkout</span>
        </div>

        <div class="details-card">
          <h3>What's included</h3>
          <ul id="feature-list"></ul>
        </div>
      </div>
    </section>

<section class="reviews-section">

  <div class="reviews-header">

    <div>
      <span class="reviews-label">
        CUSTOMER FEEDBACK
      </span>

      <h2>Reviews</h2>
    </div>

    <div class="review-summary">

      <span class="review-stars">
        ★★★★★
      </span>

      <strong id="review-count">
        Reviews
      </strong>

    </div>

  </div>

  <div class="reviews-notice">
    1000+ Customer
  </div>

  <div
    id="reviews-grid"
    class="reviews-grid">
  </div>

</section>

    <section class="description-section">
      <h2>Product description</h2>
      <div id="long-description"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div>© <span id="year"></span> Lucky Digital Goods</div>
    <div class="footer-links"><a href="mailto:learngokids@gmail.com">Contact</a></div>
  </footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
